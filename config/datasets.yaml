# Dataset registry: one entry per table the pipeline maintains.
# Adding a new dataset is (usually) just a new block here.
#
# Fields
#   source        which client fetches it (elexon | ...more later: neso, entsoe)
#   path          API path relative to the source base URL. {date} is filled for
#                 query: settlement_date
#   query         window          -> one request per time window, params below
#                 settlement_date -> one request per settlement date (path has {date})
#   params        names of the from/to query parameters (window mode only)
#   extra_params  any fixed query parameters
#   time_column   UTC timestamp used for partitioning and incremental updates
#   keys          columns that uniquely identify a row (used for de-duplication)
#   version_column  if two rows share keys, the one with the latest value here wins
#                 (e.g. publishTime: a later publication supersedes an earlier one)
#   chunk_days    size of each request window (keep small; APIs cap ranges)
#   lookback_days on every update, re-fetch this far back to catch revisions/late data
#   start         earliest date a full backfill goes back to
#   max_staleness_hours  `status` flags the dataset if the newest row is older than this
#   columns       expected columns and types (datetime | date | int | float | str).
#                 Only these are kept, so schema drift upstream can't break the store.

datasets:

  generation_fuelinst:
    description: Instantaneous generation outturn by fuel type, 5-minute (incl. interconnectors)
    source: elexon
    path: /datasets/FUELINST
    query: window
    params: {from: publishDateTimeFrom, to: publishDateTimeTo}
    time_column: startTime
    keys: [startTime, fuelType]
    version_column: publishTime
    chunk_days: 1
    lookback_days: 1
    start: "2024-01-01"
    max_staleness_hours: 2
    columns:
      startTime: datetime
      publishTime: datetime
      settlementDate: date
      settlementPeriod: int
      fuelType: str
      generation: float

  demand_indo:
    description: Initial national demand outturn, half-hourly
    source: elexon
    path: /datasets/INDO
    query: window
    params: {from: publishDateTimeFrom, to: publishDateTimeTo}
    time_column: startTime
    keys: [startTime]
    version_column: publishTime
    chunk_days: 2
    lookback_days: 2
    start: "2024-01-01"
    max_staleness_hours: 3
    columns:
      startTime: datetime
      publishTime: datetime
      settlementDate: date
      settlementPeriod: int
      demand: float

  market_index_mid:
    description: Market Index Data (APX/N2EX reference price and volume), half-hourly
    source: elexon
    path: /datasets/MID
    query: window
    params: {from: from, to: to}
    time_column: startTime
    keys: [startTime, dataProvider]
    chunk_days: 2
    lookback_days: 2
    start: "2024-01-01"
    max_staleness_hours: 4
    columns:
      startTime: datetime
      settlementDate: date
      settlementPeriod: int
      dataProvider: str
      price: float
      volume: float

  system_prices:
    description: System (imbalance) price and net imbalance volume, half-hourly
    source: elexon
    path: /balancing/settlement/system-prices/{date}
    query: settlement_date
    time_column: startTime
    keys: [settlementDate, settlementPeriod]
    lookback_days: 3
    start: "2024-01-01"
    max_staleness_hours: 4
    columns:
      startTime: datetime
      settlementDate: date
      settlementPeriod: int
      systemSellPrice: float
      systemBuyPrice: float
      netImbalanceVolume: float

  # ---------------- day-ahead prices ----------------

  da_gb_n2ex:
    description: GB day-ahead auction price (Nord Pool N2EX), £/MWh, via NESO Data Portal
    source: neso
    query: window
    path: ""
    time_column: startTime
    keys: [startTime]
    chunk_days: 31
    lookback_days: 3
    horizon_days: 2
    start: "2024-01-01"
    max_staleness_hours: 30     # published once a day for the next day
    options:
      resource_id: 4f27eea5-7038-4f73-9740-e3e4ad47c26a
      # Delivery periods in this file are GMT/UTC, not UK clock time (confirmed with scripts/check_da_alignment.py)
      timezone: UTC
    columns:
      startTime: datetime
      price: float

  da_europe:
    description: Day-ahead prices for GB's neighbours (ENTSO-E A44), EUR/MWh
    source: entsoe
    query: window
    path: ""
    time_column: startTime
    keys: [startTime, zone]
    chunk_days: 31              # ENTSO-E is slow per request (~8 s), so ask for a month at a time
    lookback_days: 2
    horizon_days: 2
    start: "2024-01-01"
    max_staleness_hours: 30
    options:
      zones: [FR, BE, NL, NO2, DK1, IE_SEM, DE_LU]
    columns:
      startTime: datetime
      zone: str
      price: float
      currency: str
      resolution_min: int

  fx_eurgbp:
    description: ECB reference rate, GBP per 1 EUR (daily)
    source: ecb
    query: window
    path: ""
    time_column: startTime
    keys: [startTime]
    chunk_days: 400
    lookback_days: 5
    start: "2024-01-01"
    max_staleness_hours: 100    # no fixings at weekends/holidays
    columns:
      startTime: datetime
      rate: float
